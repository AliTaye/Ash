<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة عاش للإعاشة</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Smooth transitions for view switching */
        #app-views > div {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-teal-50/20 to-cyan-50/30 text-slate-900 min-h-screen pb-24 relative overflow-x-hidden">

    <!-- Vibrant Background Blobs -->
    <div class="fixed top-0 right-0 -z-10 w-96 h-96 bg-teal-300/30 rounded-full blur-3xl mix-blend-multiply transform translate-x-1/3 -translate-y-1/4"></div>
    <div class="fixed top-60 left-0 -z-10 w-80 h-80 bg-cyan-300/30 rounded-full blur-3xl mix-blend-multiply transform -translate-x-1/2"></div>

    <!-- Main Container where JS will render views -->
    <div id="app-root"></div>
    
    <!-- Modal Container -->
    <div id="modal-root"></div>

    <script>
        const STATUS_FILTERS = ['الكل', 'جاهز للاستلام', 'في الطريق', 'متأخر', 'مستلم جزئياً', 'مكتمل'];
        const AREA_FILTERS = ['الكل', 'منى', 'عرفة'];
        const REASONS = { damaged: 'تالف', missing: 'مفقود', wrong_item: 'صنف خاطئ' };
        const ITEM_TYPES = ['كرتون موية', 'كرتون زمزم', 'وجبة جافة', 'وجبة معبأة'];

        const generateMockOrders = () => {
            const orders = [];
            let idCounter = 7032;
            const statuses = [
                { s: 'متأخر', sc: 'text-red-600', dc: 'bg-red-500', ic: 'alert-circle' },
                { s: 'في الطريق', sc: 'text-amber-600', dc: 'bg-amber-500', ic: 'truck' },
                { s: 'جاهز للاستلام', sc: 'text-teal-600', dc: 'bg-teal-500', ic: 'package-open' },
                { s: 'مستلم جزئياً', sc: 'text-orange-600', dc: 'bg-orange-500', ic: 'archive-restore' },
                { s: 'مكتمل', sc: 'text-emerald-600', dc: 'bg-emerald-500', ic: 'check-circle-2' }
            ];
            const drivers = ['أحمد محمد', 'خالد عبدالله', 'سعيد القحطاني', 'عمر فهد', 'ياسر الشمري', 'فهد الدوسري', 'سعد المطيري'];
            
            for (let i = 0; i < 20; i++) {
                const statusObj = statuses[i % statuses.length];
                const isMina = i % 2 === 0;
                const area = isMina ? 'منى' : 'عرفة';
                const location = `${area} - ${Math.floor(Math.random() * 90) + 10} ${isMina ? 'الماسية' : 'الذهبية'}`;
                
                const items = [
                    { id: `item_${i}_1`, name: ITEM_TYPES[i % 4], targetQty: (Math.floor(Math.random() * 10) + 5) * 10, currentQty: '', reason: '' },
                    { id: `item_${i}_2`, name: ITEM_TYPES[(i + 1) % 4], targetQty: (Math.floor(Math.random() * 5) + 2) * 10, currentQty: '', reason: '' }
                ];

                if (statusObj.s === 'مكتمل') {
                    items.forEach(item => item.currentQty = item.targetQty);
                } else if (statusObj.s === 'مستلم جزئياً') {
                    items[0].currentQty = items[0].targetQty - 10;
                    items[0].reason = 'damaged';
                    items[1].currentQty = items[1].targetQty;
                }

                orders.push({
                    id: `#${idCounter++}`,
                    status: statusObj.s,
                    area: area,
                    statusColor: statusObj.sc,
                    dotColor: statusObj.dc,
                    location: location,
                    time: statusObj.s === 'متأخر' ? 'تأخير ٣٠ دقيقة' : (statusObj.s === 'في الطريق' ? 'الوصول المتوقع: ١٠:٣٠ صباحاً' : 'المركبة في الموقع'),
                    driverName: drivers[Math.floor(Math.random() * drivers.length)],
                    icon: statusObj.ic,
                    items: items
                });
            }
            return orders;
        };

        const state = {
            orders: generateMockOrders(),
            activeStatusFilter: 'الكل',
            activeAreaFilter: 'الكل',
            searchQuery: '',
            selectedOrder: null,
            orderItems: [], // Temporary state for active order interaction
            isCreatingOrder: false,
            newOrderForm: {
                area: 'منى',
                locationNum: '',
                locationType: 'الماسية',
                items: [{ name: 'وجبة معبأة', qty: 100 }]
            }
        };

        const calculateProgress = (items, status) => {
            if (status === 'مكتمل') return 100;
            if (['متأخر', 'في الطريق', 'جاهز للاستلام'].includes(status)) return 0;
            const totalTarget = items.reduce((sum, item) => sum + item.targetQty, 0);
            const totalCurrent = items.reduce((sum, item) => sum + (Number(item.currentQty) || 0), 0);
            if (totalTarget === 0) return 0;
            return Math.round((totalCurrent / totalTarget) * 100);
        };

        const getFilteredOrders = () => {
            return state.orders.filter(order => {
                const matchesStatus = state.activeStatusFilter === 'الكل' || order.status === state.activeStatusFilter;
                const matchesArea = state.activeAreaFilter === 'الكل' || order.area === state.activeAreaFilter;
                const matchesSearch = order.id.includes(state.searchQuery) || order.location.includes(state.searchQuery);
                return matchesStatus && matchesArea && matchesSearch;
            });
        };

        const render = () => {
            const root = document.getElementById('app-root');
            if (state.selectedOrder) {
                root.innerHTML = getOrderDetailsHTML();
                document.body.classList.remove('pb-24');
                document.body.classList.add('pb-28', 'bg-slate-50');
            } else {
                root.innerHTML = getDashboardHTML();
                document.body.classList.add('pb-24');
                document.body.classList.remove('pb-28', 'bg-slate-50');
            }
            
            const modalRoot = document.getElementById('modal-root');
            modalRoot.innerHTML = state.isCreatingOrder ? getCreateOrderModalHTML() : '';

            // Initialize Lucide icons for the newly injected HTML
            lucide.createIcons();
        };

        const getDashboardHTML = () => {
            const filteredOrders = getFilteredOrders();
            const delayedCount = state.orders.filter(o => o.status === 'متأخر').length;
            const transitCount = state.orders.filter(o => o.status === 'في الطريق').length;
            const partialCount = state.orders.filter(o => o.status === 'مستلم جزئياً').length;
            const completedCount = state.orders.filter(o => o.status === 'مكتمل').length;

            let statsHTML = `
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="relative overflow-hidden rounded-3xl p-4 flex flex-col items-start justify-center gap-2 border border-white/80 shadow-lg shadow-teal-900/5 backdrop-blur-xl transition-transform hover:scale-[1.02] active:scale-95 bg-red-50/80">
                        <div class="absolute inset-0 bg-gradient-to-b from-white/50 to-transparent pointer-events-none rounded-3xl"></div>
                        <div class="flex items-center gap-2 w-full relative z-10">
                            <div class="p-2 rounded-xl bg-white/80 shadow-sm text-red-700"><i data-lucide="alert-circle" class="w-5 h-5"></i></div>
                            <span class="text-3xl font-black text-red-700 mr-auto">${delayedCount}</span>
                        </div>
                        <span class="text-sm font-bold text-red-700 mt-1 relative z-10">متأخر</span>
                    </div>
                    <div class="relative overflow-hidden rounded-3xl p-4 flex flex-col items-start justify-center gap-2 border border-white/80 shadow-lg shadow-teal-900/5 backdrop-blur-xl transition-transform hover:scale-[1.02] active:scale-95 bg-amber-50/80">
                        <div class="absolute inset-0 bg-gradient-to-b from-white/50 to-transparent pointer-events-none rounded-3xl"></div>
                        <div class="flex items-center gap-2 w-full relative z-10">
                            <div class="p-2 rounded-xl bg-white/80 shadow-sm text-amber-700"><i data-lucide="truck" class="w-5 h-5"></i></div>
                            <span class="text-3xl font-black text-amber-700 mr-auto">${transitCount}</span>
                        </div>
                        <span class="text-sm font-bold text-amber-700 mt-1 relative z-10">في الطريق</span>
                    </div>
                    <div class="relative overflow-hidden rounded-3xl p-4 flex flex-col items-start justify-center gap-2 border border-white/80 shadow-lg shadow-teal-900/5 backdrop-blur-xl transition-transform hover:scale-[1.02] active:scale-95 bg-orange-50/80">
                        <div class="absolute inset-0 bg-gradient-to-b from-white/50 to-transparent pointer-events-none rounded-3xl"></div>
                        <div class="flex items-center gap-2 w-full relative z-10">
                            <div class="p-2 rounded-xl bg-white/80 shadow-sm text-orange-700"><i data-lucide="archive-restore" class="w-5 h-5"></i></div>
                            <span class="text-3xl font-black text-orange-700 mr-auto">${partialCount}</span>
                        </div>
                        <span class="text-sm font-bold text-orange-700 mt-1 relative z-10">مستلم جزئياً</span>
                    </div>
                    <div class="relative overflow-hidden rounded-3xl p-4 flex flex-col items-start justify-center gap-2 border border-white/80 shadow-lg shadow-teal-900/5 backdrop-blur-xl transition-transform hover:scale-[1.02] active:scale-95 bg-emerald-50/80">
                        <div class="absolute inset-0 bg-gradient-to-b from-white/50 to-transparent pointer-events-none rounded-3xl"></div>
                        <div class="flex items-center gap-2 w-full relative z-10">
                            <div class="p-2 rounded-xl bg-white/80 shadow-sm text-emerald-700"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
                            <span class="text-3xl font-black text-emerald-700 mr-auto">${completedCount}</span>
                        </div>
                        <span class="text-sm font-bold text-emerald-700 mt-1 relative z-10">مكتمل</span>
                    </div>
                </div>
            `;

            let areaFiltersHTML = AREA_FILTERS.map(area => `
                <button onclick="setAreaFilter('${area}')" class="flex-1 py-2.5 text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 ${state.activeAreaFilter === area ? 'bg-teal-600 shadow-md shadow-teal-600/20 text-white' : 'text-slate-500 hover:bg-white/50'}">
                    ${area !== 'الكل' ? '<i data-lucide="map" class="w-4 h-4"></i>' : ''}
                    ${area === 'الكل' ? 'كل المشاعر' : area}
                </button>
            `).join('');

            let statusFiltersHTML = STATUS_FILTERS.map(filter => `
                <button onclick="setStatusFilter('${filter}')" class="snap-start whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-bold transition-all shadow-sm border backdrop-blur-md ${state.activeStatusFilter === filter ? 'bg-teal-900 text-white border-teal-900 shadow-teal-900/20' : 'bg-white/80 text-teal-800 border-white hover:bg-white active:bg-teal-50'}">
                    ${filter}
                </button>
            `).join('');

            let ordersHTML = filteredOrders.length === 0 
                ? `<div class="text-center py-16 bg-white/50 rounded-3xl border border-white/80 backdrop-blur-md shadow-sm">
                    <i data-lucide="utensils-crossed" class="w-12 h-12 text-teal-200 mx-auto mb-3 block"></i>
                    <p class="text-teal-700 font-bold">لا توجد طلبيات تطابق بحثك حالياً.</p>
                   </div>`
                : `<div class="space-y-4">` + filteredOrders.map(order => {
                    const progress = calculateProgress(order.items, order.status);
                    return `
                    <button onclick="openOrderDetails('${order.id}')" class="w-full text-right block bg-white/80 backdrop-blur-xl rounded-3xl p-5 border border-white shadow-lg shadow-teal-900/5 hover:shadow-xl hover:-translate-y-0.5 hover:bg-white active:translate-y-0 active:scale-[0.99] transition-all duration-200 relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-br from-white/50 to-transparent pointer-events-none"></div>
                        <div class="relative flex justify-between items-start mb-4">
                            <span class="text-xl font-black text-teal-950 tracking-tight">${order.id}</span>
                            <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full border border-slate-100 shadow-sm">
                                <span class="w-2.5 h-2.5 rounded-full ${order.dotColor} animate-pulse-slow shadow-sm"></span>
                                <span class="text-xs font-bold ${order.statusColor}">${order.status}</span>
                            </div>
                        </div>
                        <div class="relative space-y-3">
                            <div class="flex items-center gap-3 text-slate-600">
                                <div class="w-8 h-8 rounded-full bg-teal-50 flex items-center justify-center shrink-0 border border-teal-100/50">
                                    <i data-lucide="map-pin" class="w-4 h-4 text-teal-600"></i>
                                </div>
                                <span class="text-sm font-bold truncate">${order.location}</span>
                            </div>
                            <div class="flex items-center gap-3 text-slate-600">
                                <div class="w-8 h-8 rounded-full bg-teal-50 flex items-center justify-center shrink-0 border border-teal-100/50">
                                    <i data-lucide="clock" class="w-4 h-4 text-teal-600"></i>
                                </div>
                                <span class="text-sm font-medium truncate">${order.time}</span>
                            </div>
                            <div class="pt-2">
                                <div class="flex justify-between text-xs font-bold mb-1.5">
                                    <span class="${progress === 100 ? 'text-emerald-600' : 'text-slate-500'}">مستوى الإنجاز</span>
                                    <span class="${progress === 100 ? 'text-emerald-600' : 'text-teal-700'}">${progress}%</span>
                                </div>
                                <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200/50">
                                    <div class="h-full rounded-full transition-all duration-1000 ease-out ${progress === 100 ? 'bg-emerald-500' : 'bg-gradient-to-r from-teal-400 to-cyan-500'}" style="width: ${progress}%"></div>
                                </div>
                            </div>
                        </div>
                    </button>`;
                }).join('') + `</div>`;

            return `
                <header class="pt-8 pb-4 px-5 flex justify-between items-start">
                    <div>
                        <div class="flex items-center gap-2 mb-1.5">
                            <div class="bg-gradient-to-br from-teal-500 to-cyan-500 p-2 rounded-xl shadow-sm text-white">
                                <i data-lucide="utensils-crossed" class="w-6 h-6"></i>
                            </div>
                            <h1 class="text-2xl font-extrabold text-teal-900 tracking-tight">شركة عاش للإعاشة</h1>
                        </div>
                        <p class="text-xs text-teal-800 font-bold bg-white/60 border border-teal-100 inline-block px-3 py-1.5 rounded-full shadow-sm backdrop-blur-sm">منصة التتبع التشغيلية لخدمات الإعاشة</p>
                    </div>
                    <button onclick="openCreateModal()" class="bg-teal-600 text-white p-3 rounded-2xl shadow-lg shadow-teal-500/30 hover:bg-teal-700 transition-all active:scale-95">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </button>
                </header>
                <main class="px-5 space-y-6">
                    <section>${statsHTML}</section>
                    <section class="space-y-4">
                        <div class="flex bg-white/70 p-1.5 rounded-2xl border border-white shadow-sm backdrop-blur-md">
                            ${areaFiltersHTML}
                        </div>
                        <div class="relative group">
                            <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                                <i data-lucide="search" class="h-5 w-5 text-teal-500 group-focus-within:text-teal-600 transition-colors"></i>
                            </div>
                            <input type="text" placeholder="البحث برقم الطلبية أو الموقع..." value="${state.searchQuery}" oninput="setSearchQuery(this.value)" class="w-full py-4 pr-12 pl-4 rounded-2xl bg-white/80 backdrop-blur-xl border-2 border-white shadow-sm shadow-teal-900/5 text-teal-900 placeholder:text-slate-400 font-bold focus:outline-none focus:ring-4 focus:ring-teal-500/10 focus:border-teal-400 focus:bg-white transition-all" />
                        </div>
                        <div class="flex overflow-x-auto gap-2 pb-2 -mx-5 px-5 scrollbar-hide snap-x">
                            ${statusFiltersHTML}
                        </div>
                    </section>
                    <section class="space-y-4">
                        <div class="flex justify-between items-end mb-2">
                            <h2 class="text-lg font-bold text-teal-900">قائمة الطلبات</h2>
                            <span class="text-xs font-bold text-slate-500 bg-white/50 px-2 py-1 rounded-md">${filteredOrders.length} طلب</span>
                        </div>
                        ${ordersHTML}
                    </section>
                </main>
            `;
        };

        const getOrderDetailsHTML = () => {
            const order = state.selectedOrder;
            const isInteractive = order.status === 'جاهز للاستلام';
            const isArrivingSoon = ['متأخر', 'في الطريق'].includes(order.status);
            const isCompletedOrPartial = ['مكتمل', 'مستلم جزئياً'].includes(order.status);

            let warningsHTML = '';
            if (isArrivingSoon) {
                warningsHTML = `
                <div class="bg-amber-50/80 border border-amber-200 text-amber-800 p-4 rounded-3xl mb-6 flex items-start gap-3 backdrop-blur-md">
                    <i data-lucide="alert-circle" class="w-6 h-6 shrink-0 mt-0.5 text-amber-600"></i>
                    <div>
                        <h4 class="font-bold mb-1">الطلبية لم تصل بعد</h4>
                        <p class="text-sm font-medium opacity-80">لا يمكنك تسجيل استلام الأصناف حتى وصول المركبة للموقع وتحديث حالتها.</p>
                    </div>
                </div>`;
            } else if (order.status === 'مكتمل') {
                warningsHTML = `
                <div class="bg-emerald-50/80 border border-emerald-200 text-emerald-800 p-4 rounded-3xl mb-6 flex items-start gap-3 backdrop-blur-md">
                    <i data-lucide="check-circle-2" class="w-6 h-6 shrink-0 mt-0.5 text-emerald-600"></i>
                    <div>
                        <h4 class="font-bold mb-1">مكتملة بالكامل</h4>
                        <p class="text-sm font-medium opacity-80">تم استلام هذه الطلبية بالكامل مسبقاً ولا يمكن تعديلها.</p>
                    </div>
                </div>`;
            }

            let itemsHTML = state.orderItems.map((item) => {
                const isMatched = item.currentQty !== '' && Number(item.currentQty) === item.targetQty;
                const isShort = item.currentQty !== '' && Number(item.currentQty) < item.targetQty;
                const shortageAmount = isShort ? item.targetQty - Number(item.currentQty) : 0;

                let itemInteractiveHTML = '';
                if (isInteractive) {
                    itemInteractiveHTML = `
                    <div class="flex gap-3 mt-4">
                        <button onclick="updateItemField('${item.id}', 'currentQty', ${item.targetQty})" class="flex-1 flex items-center justify-center gap-2 py-3.5 rounded-2xl font-bold transition-colors shadow-sm ${isMatched ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-teal-600 text-white hover:bg-teal-700'}">
                            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                            استلام كامل
                        </button>
                        <input type="number" min="0" max="${item.targetQty}" placeholder="0" value="${item.currentQty}" oninput="updateItemField('${item.id}', 'currentQty', this.value)" class="w-24 text-center text-xl font-black text-teal-900 py-3 rounded-2xl bg-white border-2 border-teal-100 shadow-inner focus:outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/20" />
                    </div>
                    <div class="overflow-hidden transition-all duration-300 ease-in-out ${isShort ? 'max-h-40 opacity-100 mt-4 pt-4 border-t border-slate-200/60' : 'max-h-0 opacity-0 mt-0 pt-0 border-transparent'}">
                        <label class="block text-sm font-bold text-red-600 mb-2">يوجد نقص (${shortageAmount})، حدد السبب:</label>
                        <select onchange="updateItemField('${item.id}', 'reason', this.value)" class="w-full bg-red-50 border-2 border-red-100 rounded-xl px-4 py-3 text-slate-800 font-medium focus:outline-none focus:border-red-400">
                            <option value="" ${item.reason === '' ? 'selected' : ''}>اختر السبب...</option>
                            <option value="damaged" ${item.reason === 'damaged' ? 'selected' : ''}>تالف</option>
                            <option value="missing" ${item.reason === 'missing' ? 'selected' : ''}>مفقود</option>
                            <option value="wrong_item" ${item.reason === 'wrong_item' ? 'selected' : ''}>صنف خاطئ</option>
                        </select>
                    </div>`;
                }

                let itemCompletedHTML = '';
                if (isCompletedOrPartial) {
                    itemCompletedHTML = `
                    <div class="mt-2 space-y-3">
                        <div class="flex justify-between items-center p-3 rounded-xl bg-slate-50 border border-slate-100">
                            <span class="text-sm font-semibold text-slate-600">الكمية المستلمة:</span>
                            <span class="text-lg font-black ${isMatched ? 'text-emerald-600' : 'text-slate-800'}">${item.currentQty !== '' ? item.currentQty : 0}</span>
                        </div>
                        ${isShort ? `
                        <div class="p-3 rounded-xl bg-red-50 border border-red-100 flex flex-col gap-2">
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-bold text-red-600">الكمية الناقصة / التالفة:</span>
                                <span class="text-lg font-black text-red-600">${shortageAmount}</span>
                            </div>
                            <div class="flex justify-between items-center mt-1 pt-2 border-t border-red-200/50">
                                <span class="text-xs font-semibold text-red-500">السبب المسجل:</span>
                                <span class="text-sm font-bold text-red-700 bg-red-100/50 px-2 py-1 rounded-md">${REASONS[item.reason] || 'غير محدد'}</span>
                            </div>
                        </div>` : ''}
                    </div>`;
                }

                return `
                <div class="p-5 rounded-3xl backdrop-blur-md shadow-sm transition-all duration-300 ${isMatched ? 'bg-emerald-50/70 border-2 border-emerald-400' : 'bg-white/80 border border-white'} ${(!isInteractive && isShort) ? 'border-2 border-orange-300 bg-orange-50/50' : ''}">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg mb-1">${item.name}</h3>
                            <p class="text-sm font-medium text-slate-500">الكمية المطلوبة: <span class="font-bold text-slate-700">${item.targetQty}</span></p>
                        </div>
                        ${isMatched ? `<div class="bg-emerald-500 text-white p-1.5 rounded-full shadow-sm"><i data-lucide="check" class="w-4 h-4"></i></div>` : ''}
                    </div>
                    ${itemInteractiveHTML}
                    ${itemCompletedHTML}
                </div>`;
            }).join('');

            return `
                <header class="sticky top-0 z-20 p-4 bg-white/80 backdrop-blur-md border-b border-teal-100/50 shadow-sm flex items-center justify-between">
                    <button onclick="closeOrderDetails()" class="p-2 rounded-full hover:bg-teal-50 text-teal-700 transition-colors">
                        <i data-lucide="chevron-left" class="w-6 h-6 rotate-180"></i>
                    </button>
                    <div class="flex flex-col items-center">
                        <h1 class="text-xl font-bold text-slate-800">الطلبية ${order.id}</h1>
                    </div>
                    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-white/80 border border-slate-100 shadow-sm ${order.statusColor}">
                        <span class="w-2 h-2 rounded-full ${order.dotColor} animate-pulse-slow"></span>
                        ${order.status}
                    </div>
                </header>
                <main class="p-5">
                    <div class="bg-white/60 backdrop-blur-lg rounded-3xl p-5 shadow-lg shadow-teal-900/5 border border-white mb-6 space-y-4">
                        <div class="flex items-start gap-3 p-3 rounded-2xl bg-teal-50/50 border border-teal-100/50">
                            <i data-lucide="user" class="w-5 h-5 text-teal-500 mt-0.5 shrink-0"></i>
                            <div>
                                <p class="text-xs font-bold text-teal-700 mb-1">السائق</p>
                                <p class="text-slate-800 font-semibold">${order.driverName}</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-3 p-3 rounded-2xl bg-teal-50/50 border border-teal-100/50">
                            <i data-lucide="map-pin" class="w-5 h-5 text-teal-500 mt-0.5 shrink-0"></i>
                            <div>
                                <p class="text-xs font-bold text-teal-700 mb-1">موقع التوصيل</p>
                                <p class="text-slate-800 font-semibold">${order.location}</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-3 p-3 rounded-2xl bg-teal-50/50 border border-teal-100/50">
                            <i data-lucide="clock" class="w-5 h-5 text-teal-500 mt-0.5 shrink-0"></i>
                            <div>
                                <p class="text-xs font-bold text-teal-700 mb-1">حالة الوقت</p>
                                <p class="text-slate-800 font-semibold">${order.time}</p>
                            </div>
                        </div>
                    </div>
                    ${warningsHTML}
                    <div class="space-y-4">
                        <h2 class="text-lg font-bold text-teal-900 px-1 mb-2">
                            ${isInteractive ? 'مطابقة الأصناف' : 'تفاصيل الأصناف'}
                        </h2>
                        ${itemsHTML}
                    </div>
                </main>
                ${isInteractive ? `
                <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-xl border-t border-teal-100 shadow-[0_-10px_40px_-15px_rgba(20,184,166,0.15)] z-20">
                    <button onclick="confirmReceipt()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-600 hover:to-cyan-600 text-white font-bold text-lg shadow-lg shadow-teal-500/30 transition-all active:scale-[0.98]">
                        تأكيد الاستلام
                    </button>
                </div>` : ''}
            `;
        };

        const getCreateOrderModalHTML = () => {
            const form = state.newOrderForm;
            const itemsHTML = form.items.map((item, idx) => {
                const options = ITEM_TYPES.map(type => {
                    const isDisabled = form.items.some((existingItem, i) => existingItem.name === type && i !== idx);
                    return `<option value="${type}" ${item.name === type ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}>${type}</option>`;
                }).join('');

                return `
                <div class="flex gap-2 items-center bg-slate-50 p-2 rounded-xl border border-slate-100">
                    <select onchange="updateModalItem(${idx}, 'name', this.value)" class="flex-1 py-2 px-3 rounded-lg border border-slate-200 bg-white font-bold outline-none focus:border-teal-500">
                        ${options}
                    </select>
                    <input type="number" min="1" required value="${item.qty}" oninput="updateModalItem(${idx}, 'qty', this.value)" class="w-20 py-2 text-center rounded-lg border border-slate-200 font-bold outline-none focus:border-teal-500" placeholder="الكمية" />
                    ${form.items.length > 1 ? `
                    <button type="button" onclick="removeModalItem(${idx})" class="p-2 text-red-500 hover:bg-red-50 rounded-lg">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>` : ''}
                </div>`;
            }).join('');

            return `
            <div class="fixed inset-0 z-50 flex flex-col justify-end bg-slate-900/40 backdrop-blur-sm transition-opacity">
                <div class="bg-white rounded-t-3xl p-5 shadow-2xl h-[85vh] overflow-y-auto transform transition-transform duration-300">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-teal-900">إنشاء طلبية جديدة</h2>
                        <button type="button" onclick="closeCreateModal()" class="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <form onsubmit="handleCreateOrder(event)" class="space-y-5">
                        <div class="space-y-2">
                            <label class="text-sm font-bold text-teal-800">المشعر</label>
                            <div class="flex gap-2">
                                ${['منى', 'عرفة'].map(area => `
                                <button type="button" onclick="updateModalForm('area', '${area}')" class="flex-1 py-3 rounded-xl font-bold transition-all border-2 ${form.area === area ? 'bg-teal-50 border-teal-500 text-teal-700' : 'border-slate-100 text-slate-500 bg-white'}">
                                    ${area}
                                </button>
                                `).join('')}
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-bold text-teal-800">تفاصيل الموقع</label>
                            <div class="flex gap-2">
                                <input required type="number" placeholder="رقم (مثال: 34)" value="${form.locationNum}" oninput="updateModalForm('locationNum', this.value)" class="w-1/3 py-3 px-4 rounded-xl border-2 border-slate-100 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none text-center font-bold" />
                                <select onchange="updateModalForm('locationType', this.value)" class="flex-1 py-3 px-4 rounded-xl border-2 border-slate-100 focus:border-teal-500 outline-none font-bold bg-white">
                                    <option value="الماسية" ${form.locationType === 'الماسية' ? 'selected' : ''}>الماسية</option>
                                    <option value="الذهبية" ${form.locationType === 'الذهبية' ? 'selected' : ''}>الذهبية</option>
                                </select>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <label class="text-sm font-bold text-teal-800 flex justify-between items-center">
                                <span>الأصناف والكميات</span>
                                ${form.items.length < 4 ? `
                                <button type="button" onclick="addModalItem()" class="text-teal-600 bg-teal-50 p-1.5 rounded-lg text-xs font-bold flex items-center gap-1 hover:bg-teal-100 transition-colors">
                                    <i data-lucide="plus" class="w-3 h-3"></i> إضافة صنف
                                </button>` : ''}
                            </label>
                            ${itemsHTML}
                        </div>
                        <button type="submit" class="w-full mt-4 py-4 rounded-xl bg-teal-600 text-white font-bold text-lg shadow-lg shadow-teal-200">
                            إنشاء الطلب الآن
                        </button>
                    </form>
                </div>
            </div>`;
        };

        window.setAreaFilter = (area) => { state.activeAreaFilter = area; render(); };
        window.setStatusFilter = (status) => { state.activeStatusFilter = status; render(); };
        window.setSearchQuery = (query) => { state.searchQuery = query; render(); };
        
        window.openOrderDetails = (id) => {
            const order = state.orders.find(o => o.id === id);
            if(order) {
                state.selectedOrder = order;
                // Deep copy items for editing
                state.orderItems = JSON.parse(JSON.stringify(order.items));
                render();
            }
        };
        window.closeOrderDetails = () => { state.selectedOrder = null; render(); };
        
        window.updateItemField = (id, field, value) => {
            const item = state.orderItems.find(i => i.id === id);
            if (item) {
                item[field] = value;
                if (field === 'currentQty' && Number(value) >= item.targetQty) {
                    item.reason = ''; // Clear reason if matched
                }
                render();
            }
        };

        window.confirmReceipt = () => {
            const orderIndex = state.orders.findIndex(o => o.id === state.selectedOrder.id);
            if (orderIndex === -1) return;

            const updatedOrder = { ...state.selectedOrder, items: state.orderItems };
            let isFullyCompleted = true;
            let hasReceivedAnything = false;

            for (const item of updatedOrder.items) {
                const current = Number(item.currentQty) || 0;
                if (current > 0) hasReceivedAnything = true;
                if (current < item.targetQty) isFullyCompleted = false;
            }

            if (isFullyCompleted) {
                updatedOrder.status = 'مكتمل';
                updatedOrder.statusColor = 'text-emerald-600';
                updatedOrder.dotColor = 'bg-emerald-500';
                updatedOrder.icon = 'check-circle-2';
            } else if (hasReceivedAnything) {
                updatedOrder.status = 'مستلم جزئياً';
                updatedOrder.statusColor = 'text-orange-600';
                updatedOrder.dotColor = 'bg-orange-500';
                updatedOrder.icon = 'archive-restore';
            }

            state.orders[orderIndex] = updatedOrder;
            state.selectedOrder = null;
            render();
        };

        window.openCreateModal = () => { state.isCreatingOrder = true; render(); };
        window.closeCreateModal = () => { state.isCreatingOrder = false; render(); };
        window.updateModalForm = (field, value) => { state.newOrderForm[field] = value; render(); };
        
        window.updateModalItem = (idx, field, value) => {
            state.newOrderForm.items[idx][field] = value;
            render();
        };
        window.addModalItem = () => {
            const usedItems = state.newOrderForm.items.map(i => i.name);
            const nextItem = ITEM_TYPES.find(type => !usedItems.includes(type)) || ITEM_TYPES[0];
            state.newOrderForm.items.push({ name: nextItem, qty: 50 });
            render();
        };
        window.removeModalItem = (idx) => {
            state.newOrderForm.items.splice(idx, 1);
            render();
        };

        window.handleCreateOrder = (e) => {
            e.preventDefault();
            const maxId = Math.max(...state.orders.map(o => parseInt(o.id.replace('#', ''))), 0);
            const nextId = `#${maxId + 1}`;
            const form = state.newOrderForm;

            const newOrder = {
                id: nextId,
                status: 'جاهز للاستلام',
                area: form.area,
                statusColor: 'text-teal-600',
                dotColor: 'bg-teal-500',
                location: `${form.area} - ${form.locationNum} ${form.locationType}`,
                time: 'تم إنشاء الطلب حديثاً',
                driverName: 'السائق قيد التعيين',
                icon: 'package-open',
                items: form.items.map((item, idx) => ({
                    id: `new_item_${idx}`,
                    name: item.name,
                    targetQty: Number(item.qty),
                    currentQty: '',
                    reason: ''
                }))
            };

            state.orders.unshift(newOrder);
            state.isCreatingOrder = false;
            
            // Reset Form
            state.newOrderForm = {
                area: 'منى', locationNum: '', locationType: 'الماسية', items: [{ name: 'وجبة معبأة', qty: 100 }]
            };
            
            render();
        };

        // Initial Render
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
